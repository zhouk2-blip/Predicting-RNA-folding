run:
  mode: finetune
  init_model_path: archive/2026-06-01_dataset_consolidation/runs/output/Finetune_output2/best_model.pth
  output_root: output
  output_dir: auto

data:
  data_dir: dataset_final
  msa_dir: dataset_final/MSA
  val_labels_path: validation_labels_new.normalized.csv
  contact_map_dir: dataset_final/spot_maps
training:
  epochs: 25
  batch_size: 64
  lr: 0.00002
  patience: 8
  max_len: 256
  weight_decay: 0.0001

model:
  spot_bias_scale: 1.25

losses:
  raw_loss_weight: 0.00
  aligned_loss_weight: 1.0
  bond_loss_weight: 0.06
  spot_loss_weight: 0.10
  distmap_loss_weight: 0.18
  adj_loss_weight: 0.25
  short_range_loss_weight: 0.25
  medium_range_loss_weight: 0.20
  curvature_loss_weight: 0.10
  spread_loss_weight: 0.12
  bond_lower: 0.30
  bond_upper: 1.20
  short_range_max_sep: 4
  medium_range_min_sep: 5
  medium_range_max_sep: 12

metrics:
  accuracy_thresholds: [0.5, 0.75, 1.0]
